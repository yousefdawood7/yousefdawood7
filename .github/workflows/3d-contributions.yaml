name: Metrics

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

jobs:
  github-metrics:
    runs-on: ubuntu-latest

    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          user: yousefdawood7

          # Hide everything else
          base: ""

          # Generate only the 3D contribution calendar
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
